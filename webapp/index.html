<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMB.R</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <div class="topbar__left">
        <div class="brand">EMB.R</div>
        <div class="conn">
          <button type="button" id="conn-chip" class="conn__chip" aria-haspopup="true" aria-expanded="false" aria-controls="conn-menu">
            <span id="conn-dot" class="connection-dot"></span><span id="conn-label">Not connected</span>
          </button>
          <div id="conn-menu" class="conn__menu" hidden>
            <p id="conn-desc" class="conn__desc"></p>
            <button type="button" id="conn-ble"  class="btn btn--primary btn-sm">Connect EMB.R</button>
            <button type="button" id="conn-off"  class="btn btn--secondary btn-sm">Disconnect</button>
            <button type="button" id="conn-usb"  class="btn btn--secondary btn-sm">USB cable (bench)</button>
            <button type="button" id="conn-demo" class="btn btn--secondary btn-sm">Show demo</button>
          </div>
        </div>
      </div>
      <nav class="tabs" aria-label="Views">
        <a href="?view=personal" data-view-link="personal">Personal</a>
        <a href="?view=coach" data-view-link="coach">Coach</a>
        <a href="?view=supervisor" data-view-link="supervisor">Supervisor</a>
      </nav>
    </div>
  </header>

  <!-- view container — views are mounted here by JS -->
  <div id="view-container"></div>

<script type="module">
  import { mount as mountPersonal }   from './src/views/PersonalView.js';
  import { mount as mountCoach }      from './src/views/CoachView.js';
  import { mount as mountSupervisor } from './src/views/SupervisorView.js';
  import { subscribe }                from './src/lib/datastore.js';
  import {
    startDemo, connectBluetooth, connectUsb, disconnect, bleAvailable, serialAvailable,
  } from './src/lib/device.js';
  import { startWeatherWithGeolocation }    from './src/lib/weather.js';
  import { toast }                          from './src/lib/toast.js';

  // ── view router ─────────────────────────────────────────────────────
  const VIEWS = {
    personal:   mountPersonal,
    coach:      mountCoach,
    supervisor: mountSupervisor,
  };

  let _unmountFn = null;
  const container = document.getElementById('view-container');

  function switchView(name) {
    document.querySelectorAll('[data-view-link]').forEach(a => {
      if (a.dataset.viewLink === name) {
        a.setAttribute('aria-current', 'page');
      } else {
        a.removeAttribute('aria-current');
      }
    });
    if (_unmountFn) { _unmountFn(); _unmountFn = null; }
    const mountFn = VIEWS[name];
    if (mountFn) _unmountFn = mountFn(container);
  }

  // The view lives in the URL (?view=coach), so a reload keeps it and the
  // projector and the phone can open different views.
  document.querySelectorAll('[data-view-link]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const name = a.dataset.viewLink;
      const url = new URL(location.href);
      url.searchParams.set('view', name);
      history.replaceState(null, '', url);
      switchView(name);
    });
  });

  function viewFromUrl() {
    const v = new URLSearchParams(location.search).get('view');
    return v in VIEWS ? v : 'personal';
  }

  // ── connection chip ──────────────────────────────────────────────
  const connDot   = document.getElementById('conn-dot');
  const connLabel = document.getElementById('conn-label');
  const connChip  = document.getElementById('conn-chip');
  const connMenu  = document.getElementById('conn-menu');
  const connDesc  = document.getElementById('conn-desc');
  const btnBle    = document.getElementById('conn-ble');
  const btnOff    = document.getElementById('conn-off');
  const btnUsb    = document.getElementById('conn-usb');
  const btnDemo   = document.getElementById('conn-demo');

  subscribe(({ source, link }) => {
    const device = source === 'ble' || source === 'serial';
    const up     = link === 'connected';
    const via    = source === 'ble' ? 'Bluetooth' : 'USB';
    connDot.className = 'connection-dot' + (
      source === 'demo' && up ? ' simulating' :
      device && up            ? ' connected' :
      device && link !== 'off' ? ' reconnecting' : '');
    connLabel.textContent =
      source === 'demo' ? (up ? 'Demo' : 'Demo stopped') :
      !device           ? 'Not connected' :
      link === 'connected'    ? via :
      link === 'connecting'   ? 'Connecting…' :
      link === 'reconnecting' ? 'Reconnecting…' :
      link === 'stalled'      ? 'No data' : 'Disconnected';
    connDesc.textContent =
      source === 'demo' ? (up ? 'Showing a simulated session. Connect EMB.R to go live.'
                              : 'The demo is stopped. Restart it or connect EMB.R.') :
      !device           ? 'No device connected.' :
      link === 'connected'    ? `EMB.R is connected over ${via}.` :
      link === 'connecting'   ? 'Connecting to EMB.R…' :
      link === 'reconnecting' ? 'Lost EMB.R. Reconnecting by itself; history is kept.' :
      link === 'stalled'      ? 'EMB.R is connected but has stopped sending. History is kept.' :
                                'EMB.R is disconnected.';
    // Connect is offered unless Bluetooth is up or already retrying
    btnBle.hidden  = source === 'ble' && link !== 'off';
    btnOff.hidden  = !(device && link !== 'off') && !(source === 'demo' && up);
    btnOff.textContent = source === 'demo' ? 'Stop demo' : 'Disconnect';
    btnUsb.hidden  = device && link !== 'off';
    btnDemo.hidden = source === 'demo' && up;
    btnDemo.textContent = source === 'demo' ? 'Restart demo' : 'Show demo';
  });

  function setMenu(open) {
    connMenu.hidden = !open;
    connChip.setAttribute('aria-expanded', String(open));
  }
  connChip.addEventListener('click', e => { e.stopPropagation(); setMenu(connMenu.hidden); });
  document.addEventListener('click', e => { if (!connMenu.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

  // Cancelling a chooser is not an error; anything else gets a toast.
  async function tryConnect(fn, unavailable) {
    setMenu(false);
    if (unavailable) { toast(unavailable); return; }
    try { await fn(); }
    catch (err) {
      const msg = err?.message ?? String(err);
      if (err?.name === 'NotFoundError' && /cancel|no port selected/i.test(msg)) return;
      toast(`Couldn't connect: ${msg}`);
    }
  }
  btnBle.addEventListener('click',  () => tryConnect(connectBluetooth, bleAvailable() ? null : 'Bluetooth needs Chrome. Turn Bluetooth on first.'));
  btnUsb.addEventListener('click',  () => tryConnect(connectUsb, serialAvailable() ? null : 'USB needs Chrome on a laptop.'));
  btnOff.addEventListener('click',  () => { setMenu(false); disconnect(); });
  btnDemo.addEventListener('click', () => { setMenu(false); startDemo(); });

  // ── boot ─────────────────────────────────────────────────────────────
  startWeatherWithGeolocation();
  startDemo();
  switchView(viewFromUrl());
</script>

</body>
</html>
